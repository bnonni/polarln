name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']

# Supersede in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # package.json has no packageManager field, so set the version here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The test script runs bun test.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The tests run in Bun. Make sure that Node.js also loads the package.
      - name: Load the package in Node.js
        run: node --input-type=module -e "await import('./dist/index.js')"

      # The Docker tool code loads @grpc/* at the first tool call. A resolve
      # hook records each @grpc/* load during the import and polarDocker().
      - name: Make sure that an import of the package does not load gRPC
        run: |
          node --input-type=module -e "
          import {registerHooks} from 'node:module';
          const loaded = [];
          registerHooks({resolve: (spec, context, next) => {
            if (spec.startsWith('@grpc/')) loaded.push(spec);
            return next(spec, context);
          }});
          const {polarDocker} = await import('./dist/index.js');
          polarDocker({dataDir: '/tmp/polarln-ci-no-grpc'});
          await new Promise(resolve => setTimeout(resolve, 100));
          if (loaded.length) throw new Error('Loaded ' + loaded.join(', '));
          "

      # The docker backend help and list-networks do not need Docker.
      - name: Run the CLI with the docker backend in Node.js
        run: |
          dir=$(mktemp -d)
          test "$(node dist/cli.js list-networks --backend docker --data-dir "$dir" | tr -d ' \n')" = '{"networks":[]}'
          node dist/cli.js --help --backend docker > /dev/null
